<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --card:#181b22; --ink:#e9edf3; --mute:#8a93a3; --ok:#3ddc84; --warn:#ffb020; --acc:#41bdf5; }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px 16px 40px; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, system-ui, sans-serif; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.lead { color:var(--mute); margin:0 0 20px; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--mute); margin:0 0 6px; }
  input { width:100%; padding:12px; border-radius:10px; border:1px solid #2a2f3a; background:#0c0e12; color:var(--ink); font-size:16px; }
  input + label { margin-top:14px; }
  button { width:100%; padding:14px; border:0; border-radius:12px; background:var(--acc); color:#001018; font-weight:700; font-size:16px; }
  #status { margin-top:14px; min-height:22px; font-size:14px; }
  .ok { color:var(--ok); } .bad { color:var(--warn); }
  ol { color:var(--mute); padding-left:20px; margin:0; font-size:14px; }
</style>
</head>
<body>
  <h1>Home</h1>
  <p class="lead">Connect your Pebble to Home Assistant.</p>
  <div class="card">
    <label for="url">Home Assistant URL (at home)</label>
    <input id="url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://home.example.com">
    <label for="remote">Away from home (optional, e.g. Nabu Casa)</label>
    <input id="remote" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://xxxx.ui.nabu.casa">
    <label for="key">Watch key</label>
    <input id="key" type="password" autocapitalize="off" autocorrect="off" placeholder="from the Pebble Home integration">
    <label for="pin">Watch PIN (optional, 4 digits)</label>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="leave blank for no PIN">
    <a href="#" id="clearpin" style="display:none;color:var(--acc);font-size:14px;margin-top:8px;">Remove PIN</a>
    <div id="status"></div>
  </div>
  <button id="save">Connect</button>
  <div class="card" style="margin-top:14px">
    <ol>
      <li>Install the Pebble Home integration in Home Assistant.</li>
      <li>Open it, choose Configure, and copy the watch key.</li>
      <li>Paste the key here. The watch never gets an admin token.</li>
    </ol>
  </div>
<script>
  var $ = function (id) { return document.getElementById(id); };
  function status(text, ok) { var s = $('status'); s.textContent = text; s.className = ok ? 'ok' : 'bad'; }
  function legacy() { return typeof Pebble === 'undefined' || !Pebble.sendMessage; }
  if (legacy()) {
    try { var h = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}')); if (h.url) $('url').value = h.url; if (h.remote) $('remote').value = h.remote; } catch (e) {}
  } else {
    Pebble.addEventListener('ready', function () {
      Pebble.sendMessage('pkjs', { type: 'get' }).then(function (r) {
        if (r.url) $('url').value = r.url;
        if (r.remote) $('remote').value = r.remote;
        if (r.hasKey) $('key').placeholder = 'saved (leave blank to keep)';
        if (r.hasPin) { $('pin').placeholder = 'set (type a new one to change it)'; $('pin').dataset.keep = '1'; $('clearpin').style.display = 'inline-block'; }
      });
    });
  }
  $('clearpin').addEventListener('click', function (e) {
    e.preventDefault();
    delete $('pin').dataset.keep;
    $('pin').value = '';
    $('pin').placeholder = 'no PIN (press Connect to save)';
    this.style.display = 'none';
  });
  $('save').addEventListener('click', function () {
    var url = $('url').value.trim(), remote = $('remote').value.trim(), key = $('key').value.trim(), pin = $('pin').value.trim();
    if (remote && !/^https:\/\//.test(remote)) return status('Away URL must start with https://');
    if (pin && !/^\d{4}$/.test(pin)) return status('PIN must be 4 digits');
    if (!pin && $('pin').dataset.keep) pin = '__keep__';
    if (!/^https?:\/\//.test(url)) return status('URL must start with http:// or https://');
    if (legacy()) {
      location.href = 'pebblejs://close#' + encodeURIComponent(JSON.stringify({ url: url, remote: remote, key: key, pin: pin }));
      return;
    }
    status('Connecting…', true);
    Pebble.sendMessage('pkjs', { type: 'save', url: url, remote: remote, key: key, pin: pin }).then(function (r) {
      if (r.ok) status('Connected. Alarm: ' + (r.alarm || 'n/a') + '. You can close this.', true);
      else status('Could not connect: ' + r.err + '. Check the URL and key.');
    });
  });
</script>
</body>
</html>
